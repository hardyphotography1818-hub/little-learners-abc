name: Build Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies and Build Web App
        run: |
          npm install
          rm -f public/littlelearners-abc-ready.zip public/phonics-app-ready.zip
          npm run build

      - name: Generate Native Android Project & Compile APK
        run: |
          npm install @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0 --no-save
          rm -rf android
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../LittleLearners-ABC.apk

      - name: Upload Ready-to-Install Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LittleLearners-ABC-Android-APK
          path: LittleLearners-ABC.apk

      - name: Publish Direct Public APK Download Link on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "LittleLearners ABC - Official Android APK"
          body: "Download LittleLearners ABC for Pre-K & Kindergarten Kids! Tap LittleLearners-ABC.apk below to download."
          files: LittleLearners-ABC.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
